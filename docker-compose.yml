services:
  mikupatches:
    build:
      context: .
      dockerfile: Dockerfile
    image: mikupatches:latest
    container_name: mikupatches
    stdin_open: true
    tty: true
    volumes:
      # Mount input directory containing original APK/APKM packages
      - ./input:/app/input
      # Mount dist directory where built & signed APKs/APKMs will be saved
      - ./dist:/app/dist
      # Optional: Mount custom patches folder for live patch editing
      - ./patches:/app/patches:ro
      # Optional: Mount custom keystore if desired (ensure ./debug.keystore exists before uncommenting)
      # - ./debug.keystore:/app/debug.keystore
    # Example environment variables if using remote host ADB server:
    # environment:
    #   - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
